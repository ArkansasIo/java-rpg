name: CI

on:
  push:
    branches: [main, "implementation/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java 8
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "8"
      - name: Compile original Java game
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/java-rpg-classes"
          find JavaDragonQuest1-master/src -name '*.java' -print0 \
            | xargs -0 javac -encoding UTF-8 -source 1.8 -target 1.8 \
                -d "$RUNNER_TEMP/java-rpg-classes"
      - name: Compile and run quest smoke tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/java-rpg-test-classes"
          find JavaDragonQuest1-master/test -name '*.java' -print0 \
            | xargs -0 javac -encoding UTF-8 -source 1.8 -target 1.8 \
                -cp "$RUNNER_TEMP/java-rpg-classes" \
                -d "$RUNNER_TEMP/java-rpg-test-classes"
          java -cp "$RUNNER_TEMP/java-rpg-classes:$RUNNER_TEMP/java-rpg-test-classes" dq1.core.QuestSmokeTest
      - name: Check website and documentation
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s README.md
          test -s docs/DEVELOPMENT.md
          grep -q 'Training grounds' index.html
          grep -q 'Java RPG' index.html
          grep -q 'JavaDragonQuest1-master/src' README.md
      - name: Check browser demo structure
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class Check(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ids = set()
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if 'id' in attrs:
                      self.ids.add(attrs['id'])
          parser = Check()
          parser.feed(Path('index.html').read_text(encoding='utf-8'))
          required = {'demo', 'fight', 'rest', 'reset', 'health', 'location'}
          missing = required - parser.ids
          if missing:
              raise SystemExit(f'Missing expected website elements: {sorted(missing)}')
          print('Website structure smoke test passed.')
          PY
